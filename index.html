<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pet Mood Check</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef3ec; --card:#ffffff; --ink:#1f2a24; --muted:#5d6b63;
  --line:#d5dfd3; --accent:#2f6b4f; --accent-h:#245640; --on-accent:#fff;
  --chip:#f4f8f2; --chip-on:#dcebdc;
  --pos:#2f6b4f; --neu:#9a7a1c; --warn:#c8702d; --bad:#b8432f;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141b17; --card:#1d2722; --ink:#e8efe9; --muted:#9fb0a5;
    --line:#2f3d35; --accent:#6fc79a; --accent-h:#8ad8b0; --on-accent:#10261b;
    --chip:#243029; --chip-on:#2f4a3b;
    --pos:#6fc79a; --neu:#e0bf5c; --warn:#e8935a; --bad:#ee7a66;
  }
}
:root[data-theme="dark"]{
  --bg:#141b17; --card:#1d2722; --ink:#e8efe9; --muted:#9fb0a5;
  --line:#2f3d35; --accent:#6fc79a; --accent-h:#8ad8b0; --on-accent:#10261b;
  --chip:#243029; --chip-on:#2f4a3b;
  --pos:#6fc79a; --neu:#e0bf5c; --warn:#e8935a; --bad:#ee7a66;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;line-height:1.5;padding:24px 16px}
.wrap{max-width:720px;margin:0 auto}
header{margin-bottom:20px}
h1{font-size:2rem;font-weight:800;margin:0 0 4px}
header p{margin:0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
h2{font-size:1.1rem;font-weight:800;margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
label.f{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],select{width:100%;padding:11px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px}
input:focus-visible,select:focus-visible,button:focus-visible,.chip:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.group{margin-bottom:18px}
.group h3{font-size:.95rem;margin:0 0 8px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:var(--chip);border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:.92rem;user-select:none}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:checked){background:var(--chip-on);border-color:var(--accent);font-weight:600}
.chip:has(input:checked)::before{content:"✓"}
button.go{width:100%;padding:14px;font:inherit;font-weight:800;font-size:1rem;color:var(--on-accent);background:var(--accent);border:0;border-radius:12px;cursor:pointer}
button.go:hover{background:var(--accent-h)}
#resultado:empty{display:none}
.mood{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.mood .emoji{font-size:2.6rem;line-height:1}
.mood h2{margin:0;font-size:1.4rem}
.mood p{margin:0;color:var(--muted)}
.meter{height:10px;border-radius:99px;background:var(--chip);border:1px solid var(--line);overflow:hidden;margin:6px 0 14px}
.meter span{display:block;height:100%;border-radius:99px;transition:width .4s}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 12px}
dt{color:var(--muted)} dd{margin:0;font-weight:600}
.note{font-size:.85rem;color:var(--muted);margin:0}
.alert{border-left:4px solid var(--bad);padding:8px 12px;background:var(--chip);border-radius:8px;margin-bottom:12px;font-weight:600}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.meter span{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🐾 Pet Mood Check</h1>
    <p>Marque o que você observou no seu pet e veja uma estimativa do humor dele.</p>
  </header>

  <div class="card">
    <h2>Sobre o pet</h2>
    <div class="grid">
      <div><label class="f" for="tutor">Nome do tutor</label><input id="tutor" type="text" autocomplete="name"></div>
      <div><label class="f" for="animal">Nome do animal</label><input id="animal" type="text"></div>
      <div><label class="f" for="especie">Espécie</label><select id="especie"><option>Cão</option><option>Gato</option><option>Coelho</option><option>Hamster</option><option>Pássaro</option><option>Porquinho-da-índia</option><option>Cavalo</option></select></div>
      <div><label class="f" for="idade">Idade (anos)</label><input id="idade" type="number" min="0" max="40" inputmode="numeric"></div>
    </div>
  </div>

  <div class="card">
    <h2>Comportamentos observados</h2>
    <div id="lista"></div>
    <div id="especificos"></div>
    <button class="go" onclick="avaliar()">Avaliar humor</button>
  </div>

  <div class="card" id="resultado"></div>
</div>

<script>
const GRUPOS = [
  { titulo: "Sinais positivos", itens: [
    ["brincar","Brincar",3],
    ["carinho","Buscar carinho",1],
    ["apetite","Apetite normal",1],
    ["sono","Dormir bem",1]
  ]},
  { titulo: "Sinais neutros ou de atenção", itens: [
    ["vocal","Vocalização excessiva",-1],
    ["inquietacao","Inquietação",-1],
    ["arranhar","Arranhar ou roer objetos",-1],
    ["lamber","Lamber-se em excesso",-1]
  ]},
  { titulo: "Sinais de estresse", itens: [
    ["esconder","Esconder-se",-2],
    ["prostacao","Prostração",-2],
    ["semapetite","Perda de apetite",-2],
    ["xixi","Fazer necessidades fora do lugar",-2],
    ["tremor","Tremores",-3]
  ]},
  { titulo: "Sinais de agressividade", itens: [
    ["rosnar","Rosnar",-3],
    ["raiva","Raiva",-3],
    ["morder","Morder",-4]
  ]}
];
const ALERTAS = ["tremor","prostacao","semapetite","morder"];
const MAPA = {};
const lista = document.getElementById("lista");
GRUPOS.forEach(g=>{
  const d = document.createElement("div");
  d.className = "group";
  d.innerHTML = `<h3>${g.titulo}</h3><div class="chips">` +
    g.itens.map(([v,l,p])=>{ MAPA[v]={l,p}; return `<label class="chip"><input type="checkbox" value="${v}">${l}</label>`; }).join("") +
    `</div>`;
  lista.appendChild(d);
});

const ESP = {
  "Cão":[["c_rabo","Abanar o rabo",2],["c_latir","Latir",0],["c_medo","Rabo entre as pernas",-2],["c_cavar","Cavar ou destruir objetos",-1]],
  "Gato":[["g_ronronar","Ronronar",2],["g_miar","Miar",0],["g_orelhas","Orelhas para trás",-1],["g_eri","Pelos eriçados",-2]],
  "Coelho":[["r_binky","Saltitar de alegria",3],["r_pata","Bater a pata no chão",-1],["r_roer","Roer as grades",-1],["r_imovel","Ficar encolhido e imóvel",-2]],
  "Hamster":[["h_roda","Correr na roda",2],["h_bochecha","Guardar comida nas bochechas",1],["h_grade","Morder as grades",-1],["h_imovel","Ficar muito tempo imóvel",-2]],
  "Pássaro":[["p_cantar","Cantar ou assobiar",2],["p_gritar","Gritar em excesso",-1],["p_eri","Eriçar as penas e ficar quieto",-2],["p_penas","Arrancar as próprias penas",-3]],
  "Porquinho-da-índia":[["q_pop","Saltitar (pop-corn)",3],["q_assobio","Assobiar ao ver comida",1],["q_dentes","Ranger os dentes",-2],["q_encolhido","Ficar encolhido",-2]],
  "Cavalo":[["v_relinchar","Relinchar suave",1],["v_pata","Bater a pata ou escavar o chão",-1],["v_orelhas","Orelhas para trás",-2],["v_suor","Suar sem esforço",-2]]
};
Object.values(ESP).forEach(a=>a.forEach(([v,l,p])=>{ MAPA[v]={l,p}; }));
const espSel = document.getElementById("especie");
function renderEsp(){
  const itens = ESP[espSel.value] || [];
  document.getElementById("especificos").innerHTML =
    `<div class="group"><h3>Específicos de ${espSel.value.toLowerCase()}</h3><div class="chips">` +
    itens.map(([v,l])=>`<label class="chip"><input type="checkbox" value="${v}">${l}</label>`).join("") +
    `</div></div>`;
}
espSel.addEventListener("change", renderEsp);
renderEsp();

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const val = id => esc(document.getElementById(id).value.trim()) || "—";

function avaliar(){
  const marcados = [...document.querySelectorAll('#lista input:checked, #especificos input:checked')].map(i=>i.value);
  const score = marcados.reduce((s,v)=>s+MAPA[v].p,0);

  let humor, emoji, classe, cor;
  if(score >= 3){ emoji="😊"; humor="Feliz"; classe="Humor positivo"; cor="--pos"; }
  else if(score >= 0){ emoji="😐"; humor="Neutro"; classe="Humor estável"; cor="--neu"; }
  else if(score >= -3){ emoji="😟"; humor="Estressado"; classe="Necessita observação"; cor="--warn"; }
  else { emoji="🚨"; humor="Muito alterado"; classe="Procure um médico veterinário"; cor="--bad"; }

  const pct = Math.max(0, Math.min(100, ((score + 8) / 14) * 100));
  const alerta = marcados.some(v=>ALERTAS.includes(v)) && score < 0
    ? `<div class="alert">Alguns sinais marcados podem indicar dor ou doença. Se persistirem, consulte um veterinário.</div>` : "";
  const nomes = marcados.length ? marcados.map(v=>MAPA[v].l).join(", ") : "Nenhum informado";

  const r = document.getElementById("resultado");
  r.innerHTML = `
    <div class="mood"><span class="emoji">${emoji}</span>
      <div><h2>${humor}</h2><p>${classe}</p></div></div>
    <div class="meter" role="img" aria-label="Pontuação ${score}"><span style="width:${pct}%;background:var(${cor})"></span></div>
    ${alerta}
    <dl>
      <dt>Tutor</dt><dd>${val("tutor")}</dd>
      <dt>Animal</dt><dd>${val("animal")}</dd>
      <dt>Espécie</dt><dd>${val("especie")}</dd>
      <dt>Idade</dt><dd>${val("idade")}</dd>
      <dt>Comportamentos</dt><dd>${esc(nomes)}</dd>
      <dt>Pontuação</dt><dd>${score}</dd>
    </dl>
    <p class="note">Esta avaliação é apenas orientativa e não substitui a consulta com um médico veterinário.</p>`;
  r.scrollIntoView({behavior:"smooth",block:"nearest"});
}
</script>
</body>
</html>
